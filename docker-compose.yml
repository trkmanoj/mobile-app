version: '3.0'
services:
  mysql:
    image: mysql:latest
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Mobile@123
    volumes:
      - /home/ubuntu/mysql:/var/lib/mysql

  mobile-app:
    image: trkmanoj/mobile-app:latest
    container_name: mobile-app
    ports:
      - "8080:8080"
    volumes:
      - /home/ubuntu/mobile:/home/ubuntu/mobile
    depends_on:
      - mysql